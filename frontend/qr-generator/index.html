<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootAR – QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#080b14;color:#e8eaf0;font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
        .card{background:#0f1524;border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:36px;width:100%;max-width:480px;}
        input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;font-family:monospace;}
        input{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);color:#fff;}
        button{background:#00e5ff;border:none;font-weight:bold;cursor:pointer;}
        .output{display:none;margin-top:32px;text-align:center;}
        .output.visible{display:block;}
        .qr-frame{background:white;padding:20px;display:inline-block;border-radius:16px;}
        .actions{display:flex;gap:12px;margin-top:20px;}
        .btn-secondary{background:transparent;border:1px solid rgba(255,255,255,0.07);color:#fff;}
    </style>
</head>
<body>
<div class="card">
    <h3>FootAR – Match QR Generator</h3>
    <label>Match ID</label>
    <input type="number" id="matchId" placeholder="e.g. 552077" min="1">
    <label>Match Label (optional)</label>
    <input type="text" id="matchLabel" placeholder="e.g. Liverpool vs Galatasaray">
    <button onclick="generateQR()">Generate QR Code</button>

    <div class="output" id="output">
        <div class="qr-frame" id="qrcode"></div>
        <div class="actions">
            <button class="btn-secondary" onclick="copyId()">Copy Match ID</button>
            <button class="btn-secondary" onclick="downloadQR()">Download PNG</button>
        </div>
    </div>
</div>

<script>
    let currentMatchId = '';
    function generateQR() {
        const matchId = document.getElementById('matchId').value.trim();
        if (!matchId || isNaN(matchId)) return;
        currentMatchId = matchId;
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, { text: matchId, width: 220, height: 220 });
        document.getElementById('output').classList.add('visible');
    }
    function copyId() {
        navigator.clipboard.writeText(currentMatchId).then(() => alert('Copied!'));
    }
    function downloadQR() {
        const canvas = document.querySelector('#qrcode canvas');
        if (!canvas) return;
        const label = document.getElementById('matchLabel').value.trim() || `Match #${currentMatchId}`;
        const out = document.createElement('canvas');
        out.width = canvas.width + 48;
        out.height = canvas.height + 48 + 40;
        const ctx = out.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, out.width, out.height);
        ctx.drawImage(canvas, 24, 24);
        ctx.fillStyle = '#111111';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(label, out.width / 2, canvas.height + 24 + 24);
        const link = document.createElement('a');
        link.download = `footar-match-${currentMatchId}.png`;
        link.href = out.toDataURL('image/png');
        link.click();
    }
    document.getElementById('matchId').addEventListener('keydown', e => e.key === 'Enter' && generateQR());
    document.getElementById('matchLabel').addEventListener('keydown', e => e.key === 'Enter' && generateQR());
</script>
</body>
</html>
